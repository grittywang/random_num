<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>随机数生成器</title>
  <link rel="stylesheet" href="icons/materialdesignicons.min.css">
  <style>
    /* ========================================
   TOKENS — 笔记本调色盘
   ======================================== */
    :root {
      --paper: #FBF8F1;
      --ink: #2B5EA7;
      --pencil: #4A4A4A;
      --grid: #C8E0F4;
      --highlight: #FFE066;
      --eraser: #FFB5B5;
      --ruler: #5B9A4F;
      --redpen: #D94F4F;
    }

    /* 深色模式变量 */
    .dark {
      --paper: #1a1d23;
      --ink: #7EB8E6;
      --pencil: #c8ccd4;
      --grid: #2a2e36;
      --highlight: #5a4e2a;
      --eraser: #5a3a3a;
      --ruler: #3a5a35;
      --redpen: #8a4444;
    }

    /* ========================================
   RESET & BASE
   ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      -webkit-tap-highlight-color: transparent
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      background-color: var(--paper);
      display: flex;
      flex-direction: column;
      color: var(--pencil);
      overflow-x: hidden;
    }

    .page-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
    }

    /* ========================================
   CANVAS — 浮动文具背景
   ======================================== */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: .7;
    }

    /* ========================================
   NOTEBOOK — 主卡片
   ======================================== */
    .notebook {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 4px;
      padding: 36px 28px 28px;
      box-shadow: 4px 4px 0 #e8e4dc, 2px 8px 24px rgba(0, 0, 0, .06);
    }

    /* 左侧红线（装订线） */
    .notebook::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--redpen);
      opacity: .25;
    }

    /* 顶部装订环 */
    .notebook::after {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 12px;
      background: repeating-linear-gradient(90deg,
          transparent 0, transparent 8px,
          #bbb 8px, #bbb 10px,
          transparent 10px, transparent 18px);
      border-radius: 6px;
    }

    /* ========================================
   HEADER
   ======================================== */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-left: 10px
    }

    .header-icon {
      font-size: 40px;
      display: inline-block;
      background: linear-gradient(135deg, #2B5EA7, #5B9A4F);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
      margin-top: 6px;
      letter-spacing: 1px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-underline-offset: 6px;
      text-decoration-color: var(--highlight);
      text-decoration-thickness: 2px;
    }

    /* ========================================
   CONTROLS
   ======================================== */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 22px;
      padding-left: 10px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .ctrl-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      min-width: 36px;
      white-space: nowrap;
      background-image: linear-gradient(var(--highlight) 40%, transparent 40%);
      background-repeat: no-repeat;
      background-size: 100% 60%;
      background-position: 0 85%;
      padding: 0 2px;
    }

    .ctrl-val {
      min-width: 44px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* 自定义滑块 */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #ccc, #aaa);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--ink);
      border: 3px solid #fff;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, .2);
      cursor: pointer;
      transition: transform .15s;
    }

    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.25);
      background: var(--redpen);
    }

    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--ink);
      border: 3px solid #fff;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, .2);
      cursor: pointer;
    }

    input[type=range]::-moz-range-thumb:active {
      transform: scale(1.25);
      background: var(--redpen);
    }

    input[type=range]::-moz-range-track {
      height: 4px;
      background: linear-gradient(90deg, #ccc, #aaa);
      border-radius: 2px;
      border: none;
    }

    /* ========================================
   RESULT AREA
   ======================================== */
    .result-area {
      background: var(--paper);
      border: 2px dashed #ccc;
      border-radius: 3px;
      padding: 20px 12px;
      margin-bottom: 22px;
      position: relative;
      background-image: repeating-linear-gradient(transparent 0, transparent 30px,
          #e8e4dc 30px, #e8e4dc 31px);
      transition: border-color .3s;
    }

    .result-area.active {
      border-color: var(--ink)
    }

    .result-label {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 12px;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* ========================================
   DIGITS — 图纸方格
   ======================================== */
    .digits {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px
    }

    .digit-slot {
      width: 36px;
      height: 48px;
      background: #fff;
      border: 1.5px solid #bbb;
      border-bottom: 2.5px solid #999;
      border-right: 2.5px solid #999;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      transition: border-color .25s, transform .15s;
    }

    .digit-slot .digit-display {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: var(--pencil);
      font-variant-numeric: tabular-nums;
      user-select: none;
      text-shadow: .5px .5px 0 rgba(0, 0, 0, .08);
    }

    .digit-slot.rolling {
      border-color: var(--redpen);
      animation: slotShake .08s infinite alternate;
      background: var(--highlight);
    }

    @keyframes slotShake {
      0% {
        transform: translateY(-1px)
      }

      100% {
        transform: translateY(1px)
      }
    }

    .digit-slot.done {
      border-color: var(--ruler);
      border-bottom-color: #3d7a35;
      border-right-color: #3d7a35;
      background: #f0faf0;
    }

    .digit-slot.done .digit-display {
      color: #2a6e22
    }

    /* ========================================
   BUTTONS — 贴纸按钮
   ======================================== */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 28px;
      border-radius: 3px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform .15s, box-shadow .15s;
    }

    .btn i {
      font-size: 17px
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 3px 3px 0 #1a3d6e;
      transform: rotate(-1deg);
    }

    .btn-primary:hover {
      transform: rotate(0deg) translateY(-1px);
      box-shadow: 4px 4px 0 #1a3d6e
    }

    .btn-primary:active {
      transform: rotate(0deg) translateY(1px);
      box-shadow: 1px 1px 0 #1a3d6e
    }

    .btn-secondary {
      background: var(--ruler);
      color: #fff;
      box-shadow: 3px 3px 0 #3d7a35;
      transform: rotate(1deg);
    }

    .btn-secondary:hover {
      transform: rotate(0deg) translateY(-1px);
      box-shadow: 4px 4px 0 #3d7a35
    }

    .btn-secondary:active {
      transform: rotate(0deg) translateY(1px);
      box-shadow: 1px 1px 0 #3d7a35
    }

    /* ========================================
   TOAST — 便利贴
   ======================================== */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(16px) rotate(-1.5deg);
      background: var(--highlight);
      color: var(--pencil);
      padding: 10px 24px;
      border: 1.5px solid #e6c84a;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 2px 3px 6px rgba(0, 0, 0, .1);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) rotate(-1.5deg)
    }

    /* ========================================
   FOOTER
   ======================================== */
    .footer {
      text-align: center;
      padding-top: 4px
    }

    .footer p {
      font-size: 12px;
      color: #bbb;
      line-height: 1.6
    }

    .copyright {
      text-align: center;
      font-size: 11px;
      color: #ccc;
      padding: 16px 12px;
      letter-spacing: .5px;
    }

    /* ========================================
   DARK MODE TOGGLE — 右上角贴纸按钮
   ======================================== */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      width: 42px;
      height: 42px;
      border: 2px solid #ddd;
      border-radius: 4px;
      background: #fff;
      box-shadow: 2px 2px 0 #e8e4dc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .4s, border-color .4s, box-shadow .4s, transform .15s;
    }

    .theme-toggle:hover {
      transform: rotate(-5deg) scale(1.08);
    }

    .theme-toggle:active {
      transform: rotate(0deg) scale(.95);
      box-shadow: 1px 1px 0 #e8e4dc;
    }

    .theme-toggle img {
      transition: opacity .3s;
    }

    /* 亮色模式：显示蓝色太阳，其余隐藏 */
    .theme-toggle .icon-sunny {
      display: block;
    }

    .theme-toggle .icon-sunny-d {
      display: none;
    }

    .theme-toggle .icon-night {
      display: none;
    }

    .theme-toggle .icon-night-d {
      display: none;
    }

    .dark .theme-toggle {
      background: #2a2e36;
      border-color: #444;
      box-shadow: 2px 2px 0 #111;
    }

    /* 深色模式：显示黄色月亮，其余隐藏 */
    .dark .theme-toggle .icon-sunny {
      display: none;
    }

    .dark .theme-toggle .icon-sunny-d {
      display: none;
    }

    .dark .theme-toggle .icon-night {
      display: none;
    }

    .dark .theme-toggle .icon-night-d {
      display: block;
    }

    /* ========================================
   DARK MODE — 页面元素覆盖
   ======================================== */
    .dark body,
    .dark {
      background-color: var(--paper);
    }

    .dark .notebook {
      background: #22252d;
      border-color: #3a3d45;
      box-shadow: 4px 4px 0 #111, 2px 8px 24px rgba(0, 0, 0, .3);
    }

    .dark .notebook::after {
      background: repeating-linear-gradient(90deg,
          transparent 0, transparent 8px,
          #555 8px, #555 10px,
          transparent 10px, transparent 18px);
    }

    .dark .header h1 {
      color: var(--ink);
    }

    .dark .ctrl-label {
      color: var(--ink);
    }

    .dark .ctrl-val {
      color: var(--ink);
    }

    .dark .result-area {
      background: #1e2028;
      border-color: #444;
    }

    .dark .result-area.active {
      border-color: var(--ink);
      background: #1a1d23;
    }

    .dark .result-label {
      color: #666;
    }

    .dark .digit-slot {
      background: #2a2e36;
      border-color: #555;
      border-bottom-color: #666;
      border-right-color: #666;
    }

    .dark .digit-slot .digit-display {
      color: var(--ink);
      text-shadow: none;
    }

    .dark .digit-slot.rolling {
      background: var(--highlight);
      border-color: var(--redpen);
    }

    .dark .digit-slot.done {
      background: #1a2a1a;
      border-color: var(--ruler);
      border-bottom-color: #3d7a35;
      border-right-color: #3d7a35;
    }

    .dark .digit-slot.done .digit-display {
      color: #8BC78B;
    }

    .dark .btn-primary {
      background: #3a6a9a;
      box-shadow: 3px 3px 0 #1a3a5a;
    }

    .dark .btn-secondary {
      background: #3a6a35;
      box-shadow: 3px 3px 0 #1a3a1a;
    }

    .dark .toast {
      background: #3a3520;
      color: #ddd;
      border-color: #665520;
    }

    .dark .footer p {
      color: #555;
    }

    .dark .copyright {
      color: #444;
    }

    .dark input[type=range] {
      background: linear-gradient(90deg, #444, #555);
    }

    .dark input[type=range]::-webkit-slider-thumb {
      background: var(--ink);
      border-color: #222;
    }

    .dark input[type=range]::-moz-range-thumb {
      background: var(--ink);
      border-color: #222;
    }

    .dark input[type=range]::-moz-range-track {
      background: linear-gradient(90deg, #444, #555);
    }

    /* 所有颜色过渡 */
    .notebook,
    .result-area,
    .digit-slot,
    .btn,
    .toast,
    .ctrl-label,
    .ctrl-val,
    .footer p,
    .copyright,
    input[type=range],
    .theme-toggle {
      transition: background .4s, color .4s, border-color .4s, box-shadow .4s;
    }

    /* ========================================
   RESPONSIVE
   ======================================== */
    @media(max-width:500px) {
      .notebook {
        padding: 28px 16px 22px
      }

      .header h1 {
        font-size: 20px
      }

      .header-icon {
        font-size: 34px
      }

      .btn {
        padding: 10px 20px;
        font-size: 13px
      }

      .digit-slot {
        width: 28px;
        height: 40px
      }

      .digit-slot .digit-display {
        font-size: 20px
      }

      .digits {
        gap: 3px
      }

      .ctrl-label {
        min-width: 32px;
        font-size: 12px
      }

      .ctrl-val {
        font-size: 15px;
        min-width: 38px
      }
    }

    @media(max-width:360px) {
      .digit-slot {
        width: 24px;
        height: 36px
      }

      .digit-slot .digit-display {
        font-size: 17px
      }

      .digits {
        gap: 2px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .digit-slot.rolling {
        animation: none
      }

      .toast {
        transition: none
      }

      .sticky-note {
        animation: none !important
      }
    }

    /* ========================================
   STICKY NOTE — 今日祝福便利贴
   ======================================== */
    .sticky-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    .sticky-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sticky-note {
      position: relative;
      width: 300px;
      min-height: 180px;
      background: #FFF9C4;
      padding: 36px 24px 24px;
      border-radius: 2px;
      box-shadow: 3px 4px 12px rgba(0, 0, 0, .15);
      transform: rotate(-2deg) scale(.85) translateY(-30px);
      transition: transform .4s cubic-bezier(.34, 1.56, .64, 1), opacity .3s;
      opacity: 0;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    .sticky-overlay.show .sticky-note {
      transform: rotate(-2deg) scale(1) translateY(0);
      opacity: 1;
    }

    /* 顶部胶带装饰 */
    .sticky-note::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(1deg);
      width: 70px;
      height: 22px;
      background: rgba(180, 210, 240, .55);
      border: 1px solid rgba(140, 180, 220, .3);
      border-radius: 2px;
    }

    /* 底部撕边效果 */
    .sticky-note::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(135deg, #FFF9C4 33.33%, transparent 33.33%) 0 0 / 10px 8px,
        linear-gradient(225deg, #FFF9C4 33.33%, transparent 33.33%) 0 0 / 10px 8px;
      background-position: bottom;
    }

    .sticky-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border: 2px solid var(--redpen);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .15s;
      padding: 0;
    }

    .sticky-close:hover {
      background: var(--redpen);
    }

    .sticky-close:hover svg {
      stroke: #fff;
    }

    .sticky-close:active {
      transform: scale(.9);
    }

    .sticky-close svg {
      width: 14px;
      height: 14px;
      stroke: var(--redpen);
      stroke-width: 2.5;
      fill: none;
      transition: stroke .2s;
    }

    .sticky-label {
      font-size: 11px;
      color: #c8a040;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .sticky-text {
      font-size: 17px;
      font-weight: 600;
      color: #5a4a20;
      line-height: 1.7;
      word-break: break-word;
    }

    .sticky-footer {
      margin-top: 14px;
      font-size: 11px;
      color: #c8a040;
      text-align: right;
    }

    /* 深色模式便利贴 */
    .dark .sticky-overlay {
      background: rgba(0, 0, 0, .5);
    }

    .dark .sticky-note {
      background: #3a3520;
      box-shadow: 3px 4px 16px rgba(0, 0, 0, .4);
    }

    .dark .sticky-note::before {
      background: rgba(80, 100, 60, .5);
      border-color: rgba(100, 120, 80, .3);
    }

    .dark .sticky-note::after {
      background: linear-gradient(135deg, #3a3520 33.33%, transparent 33.33%) 0 0 / 10px 8px,
        linear-gradient(225deg, #3a3520 33.33%, transparent 33.33%) 0 0 / 10px 8px;
      background-position: bottom;
    }

    .dark .sticky-label {
      color: #b8a060;
    }

    .dark .sticky-text {
      color: #e0d8c0;
    }

    .dark .sticky-footer {
      color: #b8a060;
    }

    .dark .sticky-close {
      border-color: #cc6666;
    }

    .dark .sticky-close:hover {
      background: #cc6666;
    }

    .dark .sticky-close svg {
      stroke: #cc6666;
    }

    .dark .sticky-close:hover svg {
      stroke: #fff;
    }
  </style>
</head>

<body>

  <canvas id="bgCanvas"></canvas>

  <!-- 主题切换按钮：图标来自 icons/ 文件夹 -->
  <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">
    <img class="icon-sunny" src="icons/sunny.svg" alt="" width="22" height="22">
    <img class="icon-sunny-d" src="icons/sunny-dark.svg" alt="" width="22" height="22">
    <img class="icon-night" src="icons/night.svg" alt="" width="22" height="22">
    <img class="icon-night-d" src="icons/night-dark.svg" alt="" width="22" height="22">
  </button>

  <div class="page-wrap">
    <div class="notebook">
      <div class="header">
        <i class="mdi mdi-dice-multiple header-icon" id="headerIcon"></i>
        <h1>随机数生成器</h1>
      </div>

      <div class="controls">
        <div class="ctrl-row">
          <span class="ctrl-label">位数</span>
          <input type="range" id="digitCount" min="1" max="20" value="10">
          <span class="ctrl-val" id="digitVal">10</span>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">范围</span>
          <input type="range" id="maxRange" min="1" max="9" value="9">
          <span class="ctrl-val" id="maxVal">0-9</span>
        </div>
      </div>

      <div class="result-area" id="resultArea">
        <div class="result-label">点 击 生 成</div>
        <div class="digits" id="digits"></div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="generateBtn">
